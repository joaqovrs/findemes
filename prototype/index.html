<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Fin de Mes · Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efede6; --ink: #1d2320; --ink-2: #545c57;
  --line: #dcd9cf; --accent: #1f5f5b; --accent-ink: #ffffff; --accent-soft: #dcebe8;
  --series-base: #6b7280; --series-a: #1f5f5b; --series-b: #b4652a; --series-c: #6a4fa3;
  --warn-soft: #fbf0d9; --warn-ink: #6b4a00; --tag: #e8e5dc; --focus: #2b6cb0;
  --admin-bg: #14181f; --admin-surface: #1c222c; --admin-line: #2c3442; --admin-ink: #e6e9ef; --admin-ink-2: #9aa4b5; --admin-accent: #7cc4ff;
  --radius: 12px; --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 4px 16px rgb(0 0 0 / .04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121514; --surface: #1a1f1d; --surface-2: #232927; --ink: #e9ece9; --ink-2: #a6afaa;
    --line: #2e3633; --accent: #6cc3b9; --accent-ink: #0d1514; --accent-soft: #1f3532;
    --series-base: #9aa1ab; --series-a: #6cc3b9; --series-b: #e3a066; --series-c: #b39ae6;
    --warn-soft: #3a2f16; --warn-ink: #f2d79a; --tag: #2a312e; --focus: #8ab4f8;
  }
}
:root[data-theme="dark"] {
  --bg: #121514; --surface: #1a1f1d; --surface-2: #232927; --ink: #e9ece9; --ink-2: #a6afaa;
  --line: #2e3633; --accent: #6cc3b9; --accent-ink: #0d1514; --accent-soft: #1f3532;
  --series-base: #9aa1ab; --series-a: #6cc3b9; --series-b: #e3a066; --series-c: #b39ae6;
  --warn-soft: #3a2f16; --warn-ink: #f2d79a; --tag: #2a312e; --focus: #8ab4f8;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
h1, h2, h3 { line-height: 1.2; margin: 0 0 .5rem; }
h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(1.6rem, 3vw, 2.2rem); }
h2 { font-size: 1.25rem; } h3 { font-size: 1rem; }
p { margin: 0 0 .75rem; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.muted { color: var(--ink-2); }
.small { font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; }

/* prototype bar */
.proto-bar { background: var(--warn-soft); color: var(--warn-ink); font-size: .85rem; padding: .45rem 16px; display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
.proto-bar select { font: inherit; padding: .15rem .3rem; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.proto-bar .group { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }

/* public site */
.site-head { display: flex; align-items: center; justify-content: space-between; padding: 1rem 16px; max-width: 1120px; margin: 0 auto; gap: 1rem; flex-wrap: wrap; }
.brand { font-family: Fraunces, Georgia, serif; font-size: 1.35rem; font-weight: 600; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: .5rem; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: inline-grid; place-items: center; color: var(--accent-ink); font-size: .9rem; }
.site-nav { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
.site-nav a { color: var(--ink-2); text-decoration: none; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.hero { padding: 3rem 0 2rem; display: grid; grid-template-columns: 1.2fr 1fr; gap: 2rem; align-items: center; }
.hero h1 { font-size: clamp(2rem, 4.5vw, 3rem); }
.lead { font-size: 1.1rem; color: var(--ink-2); max-width: 36rem; }
.section { padding: 2.5rem 0; border-top: 1px solid var(--line); }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
@media (max-width: 860px) { .hero, .grid-3, .grid-2 { grid-template-columns: 1fr; } .grid-4 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 480px) { .grid-4 { grid-template-columns: 1fr; } }

/* components */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem; box-shadow: var(--shadow); min-width: 0; }
.card + .card { margin-top: 1rem; }
.grid-2 > .card + .card, .grid-3 > .card + .card, .grid-4 > .card + .card { margin-top: 0; }
.btn { font: inherit; font-weight: 600; border-radius: 10px; padding: .55rem 1rem; border: 1px solid transparent; cursor: pointer; background: var(--accent); color: var(--accent-ink); text-decoration: none; display: inline-flex; align-items: center; gap: .4rem; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.small { padding: .3rem .65rem; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.link { background: none; border: 0; color: var(--accent); padding: 0; font-weight: 500; }
.row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.stack > * + * { margin-top: 1rem; }
.tag { display: inline-block; font-size: .72rem; font-weight: 600; letter-spacing: .02em; padding: .1rem .45rem; border-radius: 999px; background: var(--tag); color: var(--ink-2); white-space: nowrap; }
.tag.hu { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 500; }
.tag.origin-provider_test { background: #e2e8f7; color: #2a3f73; }
.tag.origin-demo { background: var(--warn-soft); color: var(--warn-ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag.origin-provider_test { background: #26304a; color: #b9c8f0; } }
.notice { background: var(--surface-2); border-left: 4px solid var(--accent); border-radius: 8px; padding: .75rem 1rem; color: var(--ink); font-size: .92rem; }
.notice.warn { border-left-color: #b98b1c; background: var(--warn-soft); color: var(--warn-ink); }
.kpi .label { color: var(--ink-2); font-size: .85rem; }
.kpi .value { font-size: 1.45rem; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: .15rem; }
.kpi .sub { color: var(--ink-2); font-size: .82rem; margin-top: .2rem; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
label.f { display: block; font-size: .85rem; color: var(--ink-2); margin-bottom: .2rem; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .45rem .6rem; width: 100%; }
input[type=checkbox], input[type=radio] { width: auto; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .75rem; align-items: end; }
.explain { background: var(--accent-soft); border-radius: 10px; padding: .9rem 1rem; }
.explain p:last-child { margin: 0; }
.legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .85rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: .35rem; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-2); font-size: 11px; font-family: Inter, sans-serif; }
.lock { color: var(--ink-2); font-size: .85rem; }

/* app shell */
.app { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 36px); }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 1rem .75rem; display: flex; flex-direction: column; gap: .25rem; }
.side .brand { padding: .25rem .5rem 1rem; }
.side a.nav { display: flex; align-items: center; gap: .6rem; padding: .5rem .65rem; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
.side a.nav:hover { background: var(--surface-2); color: var(--ink); }
.side a.nav.active { background: var(--accent-soft); color: var(--ink); }
.side .who { margin-top: auto; padding: .75rem .5rem 0; border-top: 1px solid var(--line); font-size: .85rem; }
.main { padding: 1.5rem clamp(16px, 3vw, 2rem) 3rem; min-width: 0; }
.page-head { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; align-items: flex-end; margin-bottom: 1.25rem; }
.disclaimer { font-size: .82rem; color: var(--ink-2); border-top: 1px dashed var(--line); margin-top: 2rem; padding-top: .75rem; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: .5rem 16px; gap: .25rem; }
  .side .brand, .side .who { display: none; }
  .side a.nav { white-space: nowrap; }
}

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--surface); color: var(--ink); border-radius: 14px; max-width: 460px; width: 100%; padding: 1.25rem; box-shadow: 0 20px 60px rgb(0 0 0 / .3); max-height: 90vh; overflow: auto; }
.modal.fintoc { border-top: 6px solid #3a5bff; }
.modal.webpay { border-top: 6px solid #d5002b; }
.bank-list button { display: block; width: 100%; text-align: left; margin-bottom: .4rem; }

/* admin */
.admin { background: var(--admin-bg); color: var(--admin-ink); min-height: calc(100vh - 36px); }
.admin .card { background: var(--admin-surface); border-color: var(--admin-line); color: var(--admin-ink); box-shadow: none; }
.admin th { color: var(--admin-ink-2); } .admin td, .admin th { border-color: var(--admin-line); }
.admin .muted { color: var(--admin-ink-2); }
.admin .btn { background: var(--admin-accent); color: #0b1620; }
.admin .btn.ghost { background: transparent; color: var(--admin-ink); border-color: var(--admin-line); }
.admin input { background: #121821; color: var(--admin-ink); border-color: var(--admin-line); }
.admin .tag { background: #2a3342; color: var(--admin-ink-2); }
.admin-head { display: flex; justify-content: space-between; align-items: center; padding: .9rem 16px; border-bottom: 1px solid var(--admin-line); gap: 1rem; flex-wrap: wrap; }
.admin-tabs { display: flex; gap: .25rem; padding: .5rem 16px; border-bottom: 1px solid var(--admin-line); overflow-x: auto; }
.admin-tabs a { color: var(--admin-ink-2); text-decoration: none; padding: .4rem .7rem; border-radius: 6px; white-space: nowrap; }
.admin-tabs a.active { background: #263042; color: var(--admin-ink); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; }
.ok-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4cc38a; margin-right: .4rem; }
</style>

<body>
<div id="root"></div>
<script>
'use strict';
/* =========================================================================
   PROTOTIPO NAVEGABLE. Todo es ficticio y vive en este navegador.
   El cálculo de abajo imita el motor solo para poder conversar sobre la
   interfaz: en la aplicación real lo hace el backend (regla 8 de CLAUDE.md).
   ========================================================================= */

const START = { y: 2026, m: 10 }; // octubre 2026 = mes 0
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MONTHS_LONG = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const clpFmt = new Intl.NumberFormat('es-CL');
const fmt = n => (n < 0 ? '−$' : '$') + clpFmt.format(Math.abs(n));
const diff = n => n === 0 ? 'sin diferencia' : (n > 0 ? '+' : '−') + '$' + clpFmt.format(Math.abs(n));
const mLabel = i => { const t = START.m - 1 + i; return MONTHS[((t % 12) + 12) % 12] + ' ' + (START.y + Math.floor(t / 12)); };
const mLong = i => { const t = START.m - 1 + i; return MONTHS_LONG[((t % 12) + 12) % 12] + ' de ' + (START.y + Math.floor(t / 12)); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hu = (...codes) => codes.map(c => `<span class="tag hu" title="Historia de usuario">${c}</span>`).join(' ');
let seq = 100; const uid = p => p + (++seq);

/* ---------------- datos ficticios ---------------- */
const SEED = () => ({
  proto: { plan: 'family', sub: 'activa' },
  user: { name: 'Camila Rojas', email: 'camila@ejemplo.cl', display: 'Camila' },
  horizon: 12,
  opening: { amount: 180000, origin: 'real' },
  incomes: [
    { id: 'i1', name: 'Sueldo líquido', amount: 1080000, kind: 'recurrente', origin: 'real' },
    { id: 'i2', name: 'Aguinaldo', amount: 150000, kind: 'esporadico', month: 2, origin: 'real' },
  ],
  expenses: [
    { id: 'e1', name: 'Transporte', amount: 75000, kind: 'variable', origin: 'real' },
    { id: 'e2', name: 'Internet y celular', amount: 38000, kind: 'fijo', origin: 'real' },
    { id: 'e3', name: 'Plan de salud', amount: 62000, kind: 'fijo', origin: 'real' },
    { id: 'e4', name: 'Gastos personales', amount: 120000, kind: 'variable', origin: 'real' },
    { id: 'e5', name: 'Permiso de circulación', amount: 110000, kind: 'esporadico', month: 5, origin: 'real' },
    { id: 'e6', name: 'Matrícula curso', amount: 350000, kind: 'esporadico', month: 5, origin: 'real' },
  ],
  debts: [
    { id: 'd1', name: 'Crédito de consumo', installment: 96000, remaining: 14, origin: 'real' },
    { id: 'd2', name: 'Notebook en cuotas (tarjeta)', installment: 58000, remaining: 5, origin: 'real' },
  ],
  household: {
    name: 'Depto Ñuñoa',
    members: [ { id: 'm1', display: 'Camila', role: 'admin', me: true }, { id: 'm2', display: 'Tomás', role: 'miembro' } ],
    invites: [ { email: 'v***@ejemplo.cl', status: 'pendiente' } ],
    expenses: [
      { id: 'h1', name: 'Arriendo', amount: 780000, rule: { type: 'porcentaje', shares: { m1: 55, m2: 45 } }, author: 'Camila' },
      { id: 'h2', name: 'Cuentas básicas', amount: 95000, rule: { type: 'iguales' }, author: 'Tomás' },
      { id: 'h3', name: 'Supermercado común', amount: 260000, rule: { type: 'iguales' }, author: 'Camila' },
      { id: 'h4', name: 'Plan de mascota', amount: 18000, rule: { type: 'asignado', member: 'm2' }, author: 'Tomás' },
    ],
  },
  bank: { connected: false, accounts: [], movements: [] },
  scenarios: [
    { id: 's1', name: 'Notebook nuevo en 12 cuotas', decisions: [ { id: 'x1', type: 'installment_purchase', label: 'Notebook', total: 899990, n: 12, start: 1 } ] },
    { id: 's2', name: 'Si baja mi sueldo desde enero', decisions: [ { id: 'x2', type: 'income_change', delta: -250000, start: 3, end: null } ] },
  ],
  demo: { opening: 150000, income: 650000, expense: 480000 },
});

let S;
try { S = JSON.parse(localStorage.getItem('fdm-proto')) || SEED(); } catch { S = SEED(); }
const save = () => { try { localStorage.setItem('fdm-proto', JSON.stringify(S)); } catch {} };
const ui = { decisionType: 'installment_purchase', editing: null, compare: [], modal: null, adminAuthed: false };

/* ---------------- plan efectivo (Tablas 13 y 14) ---------------- */
const SUB_STATES = { gratuito: 'Gratuito', pendiente: 'Pendiente', activa: 'Activa', por_vencer: 'Por vencer', vencida: 'Vencida', fallida: 'Fallida', cancelada: 'Cancelada' };
const PLAN_NAMES = { free: 'Gratuito', paid: 'Pagado', family: 'Familiar' };
function effectivePlan() {
  const { plan, sub } = S.proto;
  if (sub === 'gratuito' || sub === 'vencida') return 'free';
  if (sub === 'pendiente' || sub === 'fallida') return 'free'; // se mantiene el plan anterior (aquí, gratuito)
  return plan;
}
const limits = () => effectivePlan() === 'free'
  ? { saved: 2, compare: 1, prepay: false, household: false }
  : { saved: Infinity, compare: Infinity, prepay: true, household: effectivePlan() === 'family' };
const householdVisible = () => limits().household || S.proto.sub === 'vencida' && S.proto.plan === 'family';
const householdReadOnly = () => S.proto.sub === 'vencida';

/* ---------------- motor (imitación) ---------------- */
function myHouseholdShare() {
  if (!householdVisible()) return { total: 0, lines: [] };
  const me = S.household.members.find(m => m.me);
  const n = S.household.members.length;
  const lines = S.household.expenses.map(e => {
    let part = 0;
    if (e.rule.type === 'iguales') part = Math.floor(e.amount / n);
    else if (e.rule.type === 'porcentaje') part = Math.floor(e.amount * (e.rule.shares[me.id] || 0) / 100);
    else if (e.rule.type === 'asignado') part = e.rule.member === me.id ? e.amount : 0;
    return { name: e.name, part };
  });
  return { total: lines.reduce((a, l) => a + l.part, 0), lines };
}

function baseModel(h) {
  const income = Array(h).fill(0), expenses = Array(h).fill(0), sporadic = Array(h).fill(null).map(() => []);
  for (const i of S.incomes) {
    if (i.kind === 'esporadico') { if (i.month < h) income[i.month] += i.amount; }
    else for (let k = 0; k < h; k++) income[k] += i.amount;
  }
  for (const e of S.expenses) {
    if (e.kind === 'esporadico') { if (e.month < h) { expenses[e.month] += e.amount; sporadic[e.month].push(e); } }
    else for (let k = 0; k < h; k++) expenses[k] += e.amount;
  }
  const share = myHouseholdShare().total;
  const household = Array(h).fill(share);
  const debts = S.debts.map(d => {
    const sched = Array(h).fill(0);
    for (let k = 0; k < Math.min(d.remaining, h); k++) sched[k] = d.installment;
    return { id: d.id, name: d.name, installment: d.installment, remaining: d.remaining, sched };
  });
  return { h, income, expenses, household, debts, sporadic, notes: [] };
}
const clone = m => ({ ...m, income: [...m.income], expenses: [...m.expenses], household: [...m.household], debts: m.debts.map(d => ({ ...d, sched: [...d.sched] })), notes: [] });
const endIdx = d => d.remaining - 1; // último mes con cuota, relativo a mes 0

const DECISIONS = {
  installment_purchase: {
    name: 'Compra en N cuotas',
    apply(m, d) {
      const base = Math.floor(d.total / d.n), last = d.total - base * (d.n - 1);
      for (let k = 0; k < d.n; k++) { const i = d.start + k; if (i < m.h) m.expenses[i] += (k === d.n - 1 ? last : base); }
      return `Compra en ${d.n} cuotas de ${fmt(base)} (total ${fmt(d.total)}) desde ${mLong(d.start)} hasta ${mLong(d.start + d.n - 1)}.`;
    },
  },
  fixed_expense: {
    name: 'Alta o modificación de gasto fijo',
    apply(m, d) {
      const to = d.end == null ? m.h - 1 : Math.min(d.end, m.h - 1);
      let delta = d.amount, text;
      if (d.target) {
        const e = S.expenses.find(x => x.id === d.target);
        delta = d.amount - (e ? e.amount : 0);
        text = `"${esc(e ? e.name : 'Gasto')}" pasa de ${fmt(e ? e.amount : 0)} a ${fmt(d.amount)} mensuales desde ${mLong(d.start)}${d.end == null ? '' : ' hasta ' + mLong(d.end)}.`;
      } else {
        text = `Nuevo gasto fijo "${esc(d.label)}" de ${fmt(d.amount)} mensuales desde ${mLong(d.start)}${d.end == null ? ', sin término' : ' hasta ' + mLong(d.end)}.`;
      }
      for (let k = d.start; k <= to; k++) m.expenses[k] += delta;
      return text;
    },
  },
  one_time_expense: {
    name: 'Gasto único',
    apply(m, d) { if (d.month < m.h) m.expenses[d.month] += d.amount; return `Gasto único "${esc(d.label)}" de ${fmt(d.amount)} en ${mLong(d.month)}.`; },
  },
  debt_prepayment: {
    name: 'Adelanto o prepago de deuda',
    paid: true,
    apply(m, d) {
      const debt = m.debts.find(x => x.id === d.debt);
      if (!debt) return 'La deuda seleccionada ya no existe.';
      const after = debt.remaining - (d.month + 1); // cuotas pendientes después del mes de aplicación
      const pending = debt.sched.slice(d.month + 1).reduce((a, b) => a + b, 0) + Math.max(0, after - (m.h - d.month - 1)) * debt.installment;
      const amount = Math.min(d.amount, pending);
      if (d.month < m.h) m.expenses[d.month] += amount;
      const capped = amount < d.amount ? ` El monto se ajusta a ${fmt(amount)}, que es lo que queda por pagar.` : '';
      if (after <= 0) return `"${esc(debt.name)}" no tiene cuotas pendientes después de ${mLong(d.month)}; el prepago no altera el calendario.`;
      const fullSched = Array(after).fill(debt.installment);
      if (d.modality === 'reduce_term') {
        let left = amount, k = fullSched.length - 1;
        while (left > 0 && k >= 0) { const take = Math.min(left, fullSched[k]); fullSched[k] -= take; left -= take; if (fullSched[k] === 0) k--; }
        const alive = fullSched.filter(x => x > 0).length;
        for (let i = 0; i < after; i++) { const idx = d.month + 1 + i; if (idx < m.h) debt.sched[idx] = fullSched[i]; }
        const oldEnd = d.month + after, newEnd = d.month + alive;
        return `Prepago de ${fmt(amount)} a "${esc(debt.name)}" en ${mLong(d.month)}, modalidad <b>reducir plazo</b>: se extinguen cuotas desde la última; la cuota se mantiene en ${fmt(debt.installment)} y el término pasa de ${mLong(oldEnd)} a ${alive ? mLong(newEnd) : mLong(d.month)}.${capped}`;
      }
      const rest = after * debt.installment - amount;
      const inst = Math.floor(rest / after), last = rest - inst * (after - 1);
      for (let i = 0; i < after; i++) { const idx = d.month + 1 + i; if (idx < m.h) debt.sched[idx] = i === after - 1 ? last : inst; }
      return `Prepago de ${fmt(amount)} a "${esc(debt.name)}" en ${mLong(d.month)}, modalidad <b>reducir cuota</b>: la cuota pasa de ${fmt(debt.installment)} a ${fmt(inst)} y el término se mantiene en ${mLong(d.month + after)}.${capped}`;
    },
  },
  income_change: {
    name: 'Variación de ingreso',
    apply(m, d) {
      const to = d.end == null ? m.h - 1 : Math.min(d.end, m.h - 1);
      for (let k = d.start; k <= to; k++) m.income[k] += d.delta;
      return `El ingreso ${d.delta >= 0 ? 'aumenta' : 'disminuye'} en ${fmt(Math.abs(d.delta))} mensuales desde ${mLong(d.start)}${d.end == null ? ', sin término' : ' hasta ' + mLong(d.end)}.`;
    },
  },
};

function project(m) {
  let bal = S.opening.amount; const months = [];
  for (let k = 0; k < m.h; k++) {
    const debt = m.debts.reduce((a, d) => a + d.sched[k], 0);
    const commit = m.expenses[k] + m.household[k] + debt;
    const opening = bal; bal = bal + m.income[k] - commit;
    months.push({ k, opening, income: m.income[k], expenses: m.expenses[k], household: m.household[k], debt, margin: m.income[k] - commit, closing: bal });
  }
  return months;
}
function indicators(months) {
  let min = months[0];
  for (const x of months) if (x.closing < min.closing) min = x;
  const brk = months.find(x => x.closing < 0);
  const f = months[0];
  return {
    min: min.closing, minMonth: min.k, breakMonth: brk ? brk.k : null,
    margin: f.margin, debtLoad: f.income ? Math.round(f.debt * 1000 / f.income) / 10 : null,
    final: months[months.length - 1].closing,
  };
}
function run(decisions, h = S.horizon) {
  const m = clone(baseModel(h));
  const notes = decisions.map(d => DECISIONS[d.type].apply(m, d));
  const months = project(m);
  return { months, ind: indicators(months), notes };
}
const fmtLoad = v => v == null ? '—' : String(v).replace('.', ',') + ' %';

/* ---------------- explicaciones descriptivas (HU10, HU39) ---------------- */
function explainBase(r) {
  const avg = k => Math.round(r.months.reduce((a, x) => a + x[k], 0) / r.months.length);
  const parts = [`En promedio, cada mes ingresan ${fmt(avg('income'))} y se comprometen ${fmt(avg('expenses'))} en gastos, ${fmt(avg('debt'))} en cuotas`];
  const share = myHouseholdShare().total;
  parts[0] += share ? ` y ${fmt(share)} de aporte al hogar.` : '.';
  const min = r.ind.minMonth, model = baseModel(S.horizon), spor = model.sporadic[min];
  let s = `El saldo más bajo del período es ${fmt(r.ind.min)}, al cierre de ${mLong(min)}.`;
  if (spor && spor.length) s += ` Ese mes coinciden gastos esporádicos por ${fmt(spor.reduce((a, e) => a + e.amount, 0))} (${spor.map(e => esc(e.name)).join(', ')}).`;
  parts.push(s);
  parts.push(r.ind.breakMonth == null ? `El saldo proyectado no llega a ser negativo dentro de los ${S.horizon} meses.` : `El saldo proyectado pasa a ser negativo en ${mLong(r.ind.breakMonth)}.`);
  const ends = S.debts.filter(d => d.remaining <= S.horizon).map(d => `"${esc(d.name)}" termina en ${mLong(endIdx(d))}`);
  if (ends.length) parts.push(`Cuotas que terminan dentro del horizonte: ${ends.join('; ')}.`);
  return parts;
}
function explainScenario(sc, r, base) {
  const out = [`Este escenario aplica ${sc.decisions.length === 1 ? 'una decisión' : sc.decisions.length + ' decisiones'} sobre tu situación base. La base no se modifica.`];
  r.notes.forEach(n => out.push(n));
  out.push(`Saldo más bajo: ${fmt(r.ind.min)} en ${mLong(r.ind.minMonth)} (en la base: ${fmt(base.ind.min)} en ${mLong(base.ind.minMonth)}; diferencia ${diff(r.ind.min - base.ind.min)}).`);
  if (r.ind.breakMonth != null && base.ind.breakMonth == null) out.push(`Con estas decisiones el saldo pasa a ser negativo en ${mLong(r.ind.breakMonth)}; en la base no ocurre dentro del horizonte.`);
  else if (r.ind.breakMonth == null && base.ind.breakMonth != null) out.push(`Con estas decisiones el saldo no llega a ser negativo dentro del horizonte; en la base ocurre en ${mLong(base.ind.breakMonth)}.`);
  else if (r.ind.breakMonth != null) out.push(`El saldo pasa a ser negativo en ${mLong(r.ind.breakMonth)} (en la base: ${mLong(base.ind.breakMonth)}).`);
  if (sc.decisions.length > 1) {
    const effects = sc.decisions.map(d => ({ d, e: run([d]).ind.final - base.ind.final }));
    effects.sort((a, b) => Math.abs(b.e) - Math.abs(a.e));
    out.push(`La decisión con mayor efecto acumulado sobre el saldo final es "${DECISIONS[effects[0].d.type].name}" (${diff(effects[0].e)} al cierre de ${mLong(S.horizon - 1)}).`);
  }
  return out;
}

/* ---------------- gráfico ---------------- */
function chart(series, h, opts = {}) {
  const W = 720, H = opts.height || 240, L = 64, R = 12, T = 12, B = 28;
  const all = series.flatMap(s => s.values).concat(0);
  let lo = Math.min(...all), hi = Math.max(...all); if (hi === lo) hi = lo + 1;
  const pad = (hi - lo) * .08; lo -= pad; hi += pad;
  const x = i => L + (h === 1 ? 0 : i * (W - L - R) / (h - 1));
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const ticks = [lo + pad, (lo + hi) / 2, hi - pad].map(v => Math.round(v / 10000) * 10000);
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Saldo proyectado por mes')}">`;
  ticks.forEach(t => { g += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t < 0 ? '−' : ''}$${clpFmt.format(Math.abs(Math.round(t / 1000)))} mil</text>`; });
  g += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink-2)" stroke-dasharray="4 4" stroke-width="1"/>`;
  for (let i = 0; i < h; i++) if (h <= 12 || i % 2 === 0) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${mLabel(i).replace(' 20', " '")}</text>`;
  series.forEach(s => {
    g += `<polyline fill="none" stroke="${s.color}" stroke-width="${s.width || 2.5}" ${s.dash ? 'stroke-dasharray="6 5"' : ''} points="${s.values.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>`;
    s.values.forEach((v, i) => { g += `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${s.color}"><title>${esc(s.name)} · ${mLabel(i)}: ${fmt(v)}</title></circle>`; });
  });
  return `<div class="chart">${g}</svg></div>` + `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}<span><i style="background:var(--ink-2)"></i>línea de $0</span></div>`;
}

/* ---- Comparar (HU09) ---- */
function pageComparar() {
  const lim = limits(), base = run([]);
  if (!ui.compare.length) ui.compare = S.scenarios.slice(0, lim.compare === Infinity ? 2 : 1).map(s => s.id);
  const chosen = S.scenarios.filter(s => ui.compare.includes(s.id));
  const runs = chosen.map(s => ({ s, r: run(s.decisions) }));
  const colors = ['var(--series-a)', 'var(--series-b)', 'var(--series-c)'];
  const brk = i => i == null ? 'No ocurre' : mLabel(i);
  const rows = [
    ['Saldo mínimo proyectado', r => fmt(r.ind.min), (r) => diff(r.ind.min - base.ind.min)],
    ['Mes del saldo mínimo', r => mLabel(r.ind.minMonth), null],
    ['Mes de quiebre', r => brk(r.ind.breakMonth), null],
    ['Margen mensual (' + mLabel(0) + ')', r => fmt(r.ind.margin), r => diff(r.ind.margin - base.ind.margin)],
    ['Carga de deuda sobre ingreso', r => fmtLoad(r.ind.debtLoad), null],
    ['Saldo al cierre de ' + mLabel(S.horizon - 1), r => fmt(r.ind.final), r => diff(r.ind.final - base.ind.final)],
  ];
  return head('Comparar escenarios', 'Indicadores de cada escenario junto a la base.', hu('HU09')) + `
  <div class="card"><b>Escenarios a comparar</b> <span class="small muted">${lim.compare === Infinity ? 'Hasta 3 a la vez.' : 'Plan Gratuito: 1 escenario frente a la base.'}</span>
    <div class="row" style="margin-top:.5rem">${S.scenarios.map(s => `<label class="row small" style="gap:.35rem"><input type="checkbox" data-action-change="compare" value="${s.id}" ${ui.compare.includes(s.id) ? 'checked' : ''}>${esc(s.name)}</label>`).join('')}</div></div>
  <div class="card table-wrap"><table><thead><tr><th>Indicador</th><th class="r">Base</th>${runs.map(x => `<th class="r">${esc(x.s.name)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(([label, f, d]) => `<tr><td>${label}</td><td class="r">${f(base)}</td>${runs.map(x => `<td class="r">${f(x.r)}${d ? `<div class="small muted">${d(x.r)} vs. base</div>` : ''}</td>`).join('')}</tr>`).join('')}</tbody></table>
    <p class="small muted" style="margin-top:.5rem">Los escenarios aparecen en el orden en que los creaste. Fin de Mes no los ordena por conveniencia ni destaca ninguno.</p></div>
  <div class="card">${chart([{ name: 'Base', values: base.months.map(x => x.closing), color: 'var(--series-base)', dash: true }, ...runs.map((x, i) => ({ name: x.s.name, values: x.r.months.map(m => m.closing), color: colors[i] }))], S.horizon)}</div>`;
}

    <div class="stack"><button class="btn" data-action="webpay-result" data-r="ok">Pago aprobado</button><button class="btn ghost" data-action="webpay-result" data-r="rejected">Pago rechazado</button><button class="btn ghost" data-action="webpay-result" data-r="abort">Abandonar el pago (TBK_TOKEN)</button></div></div></div>`;
  if (m.kind === 'toast') return `<div class="modal-bg" data-action="modal-close-bg"><div class="modal" role="alertdialog" aria-modal="true"><p>${esc(m.msg)}</p><button class="btn small" data-action="modal-close">Entendido</button></div></div>`;
  if (m.kind === 'confirm-delete') return `<div class="modal-bg"><div class="modal" role="alertdialog" aria-modal="true"><h3>¿Eliminar tu cuenta?</h3><p class="muted">Se borrarán de forma efectiva tus datos individuales. Esta acción no se puede deshacer.</p><div class="row"><button class="btn" data-action="toast" data-msg="(Prototipo) La cuenta se eliminaría y se cerraría la sesión.">Eliminar definitivamente</button><button class="btn ghost" data-action="modal-close">Volver</button></div></div></div>`;
  return '';
}

/* =========================== ROUTER =========================== */
function render() {
  const hash = location.hash.replace(/^#/, '') || '/';
  const parts = hash.split('?')[0].split('/').filter(Boolean);
  let html;
  if (parts[0] === 'app') {
    const page = parts[1] || 'resumen';
    if (page === 'escenarios') ui.editing = parts[2] || null;
    const pages = { resumen: pageResumen, registro: pageRegistro, bancos: pageBancos, proyeccion: pageProyeccion, escenarios: pageEscenarios, comparar: pageComparar, hogar: pageHogar, plan: pagePlan, cuenta: pageCuenta };
    html = appShell(page, (pages[page] || pageResumen)());
  } else if (parts[0] === 'admin') html = adminPage(parts[1] || 'cuentas');
  else if (parts[0] === 'demo') html = demoPage();
  else if (['login', 'registro', 'recuperar', 'invitacion'].includes(parts[0])) html = authPage(parts[0]);
  else if (parts[0] === 'verificar') html = verifyPage();
  else if (parts[0] === 'mapa') html = mapPage();
  else html = sitePublic();
  document.getElementById('root').innerHTML = protoBar() + html + modalHtml();
  document.title = 'Fin de Mes · Prototipo';
}
const rerender = () => { save(); render(); };
window.addEventListener('hashchange', () => {
  ui.modal = null; render();
  const anchor = location.hash.match(/^#(planes|privacidad|casos|contacto)$/);
  if (anchor) document.getElementById(anchor[1])?.scrollIntoView(); else window.scrollTo(0, 0);
});

/* ---------------- eventos ---------------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]'); if (!a) return;
  const act = a.dataset.action;
  if (act === 'modal-close-bg' && e.target !== a) return;
  if (a.tagName === 'A' && act !== 'admin-logout') e.preventDefault();
  const id = a.dataset.id;
  switch (act) {
    case 'go': location.hash = a.dataset.to; return;
    case 'reset': S = SEED(); ui.compare = []; ui.adminAuthed = false; return rerender();
    case 'toast': ui.modal = { kind: 'toast', msg: a.dataset.msg }; return render();
    case 'modal-close': case 'modal-close-bg': ui.modal = null; return render();
    case 'del': S[a.dataset.coll] = S[a.dataset.coll].filter(x => x.id !== id); return rerender();
    case 'del-scenario': S.scenarios = S.scenarios.filter(s => s.id !== id); ui.compare = ui.compare.filter(x => x !== id); return rerender();
    case 'del-decision': { const sc = S.scenarios.find(s => s.id === ui.editing); sc.decisions = sc.decisions.filter(d => d.id !== id); return rerender(); }
    case 'fintoc-open': ui.modal = { kind: 'fintoc', step: 1 }; return render();
    case 'fintoc-bank': ui.modal.step = 2; return render();
    case 'fintoc-done': S.bank = bankData('provider_test'); ui.modal = null; return rerender();
    case 'demo-bank': S.bank = bankData('demo'); return rerender();
    case 'bank-disconnect': S.bank = { connected: false, accounts: [], movements: [] }; ui.modal = { kind: 'toast', msg: 'Banco desconectado. El acceso de Fintoc fue revocado. Lo que ya llevaste a tu registro se mantiene.' }; return rerender();
    case 'mark-recurring': {
      const m = S.bank.movements.find(x => x.id === id); m.added = true;
      const coll = m.amount > 0 ? 'incomes' : 'expenses';
      S[coll].push({ id: uid('b'), name: m.desc, amount: Math.abs(m.amount), kind: m.amount > 0 ? 'recurrente' : 'fijo', origin: m.origin });
      return rerender();
    }
    case 'opening-from-bank': S.opening = { amount: S.bank.accounts[0].available, origin: S.bank.accounts[0].origin }; return rerender();
    case 'webpay-open': ui.modal = { kind: 'webpay', plan: a.dataset.plan }; return render();
    case 'webpay-result': {
      const r = a.dataset.r;
      if (r === 'ok') { S.proto = { plan: ui.modal.plan, sub: 'activa' }; ui.modal = { kind: 'toast', msg: 'El servidor confirmó el pago con Transbank (commit). Plan activado una sola vez, aunque el navegador vuelva dos veces.' }; }
      else if (r === 'rejected') { S.proto.sub = S.proto.sub === 'gratuito' ? 'fallida' : S.proto.sub; ui.modal = { kind: 'toast', msg: 'Transbank rechazó la transacción. Se mantiene tu plan anterior.' }; }
      else ui.modal = { kind: 'toast', msg: 'Volviste sin pagar (TBK_TOKEN). No hubo cobro y tu plan no cambia.' };
      return rerender();
    }
    case 'cancel-sub': S.proto.sub = 'cancelada'; return rerender();
    case 'delete-account': ui.modal = { kind: 'confirm-delete' }; return render();
    case 'admin-login': ui.adminAuthed = true; location.hash = '#/admin/cuentas'; return render();
    case 'admin-logout': ui.adminAuthed = false; return render();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.proto) { S.proto[t.dataset.proto] = t.value; return rerender(); }
  const act = t.dataset.actionChange;
  if (act === 'horizon') { S.horizon = +t.value; return rerender(); }
  if (act === 'decision-type') { ui.decisionType = t.value; return render(); }
  if (act === 'compare') {
    const max = limits().compare === Infinity ? 3 : 1;
    if (t.checked) { ui.compare.push(t.value); while (ui.compare.length > max) ui.compare.shift(); }
    else ui.compare = ui.compare.filter(x => x !== t.value);
    return render();
  }
});
document.addEventListener('submit', e => {
  const f = e.target; const kind = f.dataset.form; if (!kind) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  const int = k => Math.trunc(Number(v[k]) || 0);
  switch (kind) {
    case 'contact': ui.modal = { kind: 'toast', msg: 'Mensaje enviado. Respondemos dentro de 24 horas hábiles.' }; return render();
    case 'demo': S.demo = { opening: int('opening'), income: int('income'), expense: int('expense') }; ui.demoDecision = { total: int('total'), n: Math.max(1, int('n')) }; return rerender();
    case 'opening': S.opening = { amount: int('amount'), origin: 'real' }; return rerender();
    case 'add': S[f.dataset.coll].push({ id: uid('r'), name: v.name, amount: int('amount'), kind: v.kind, month: int('month'), origin: 'real' }); return rerender();
    case 'debt': S.debts.push({ id: uid('d'), name: v.name, installment: int('installment'), remaining: int('remaining'), origin: 'real' }); return rerender();
    case 'new-scenario': { const id = uid('s'); S.scenarios.push({ id, name: v.name, decisions: [] }); save(); location.hash = '#/app/escenarios/' + id; return; }
    case 'rename': S.scenarios.find(s => s.id === ui.editing).name = v.name; return rerender();
    case 'decision': {
      const sc = S.scenarios.find(s => s.id === ui.editing), t = ui.decisionType, d = { id: uid('x'), type: t };
      if (t === 'installment_purchase') Object.assign(d, { label: v.label, total: int('total'), n: Math.max(1, int('n')), start: int('start') });
      if (t === 'fixed_expense') Object.assign(d, { target: v.target || null, label: v.label, amount: int('amount'), start: int('start'), end: v.end === '' ? null : int('end') });
      if (t === 'one_time_expense') Object.assign(d, { label: v.label, amount: int('amount'), month: int('month') });
      if (t === 'debt_prepayment') Object.assign(d, { debt: v.debt, amount: int('amount'), month: int('month'), modality: v.modality });
      if (t === 'income_change') Object.assign(d, { delta: int('delta'), start: int('start'), end: v.end === '' ? null : int('end') });
      if (d.end != null && d.end < d.start) d.end = d.start;
      sc.decisions.push(d); return rerender();
    }
    case 'invite': S.household.invites.push({ email: v.email.replace(/^(.).*@/, '$1***@'), status: 'pendiente' }); return rerender();
    case 'hh-expense': {
      let rule = { type: 'iguales' };
      if (v.rule === 'porcentaje') { const p = Math.min(100, Math.max(0, int('pct'))); rule = { type: 'porcentaje', shares: { m1: p, m2: 100 - p } }; }
      if (v.rule.startsWith('asignado:')) rule = { type: 'asignado', member: v.rule.split(':')[1] };
      S.household.expenses.push({ id: uid('h'), name: v.name, amount: int('amount'), rule, author: S.user.display }); return rerender();
    }
  }
});
render();
</script>
</body>
</html>
